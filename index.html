<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | Online Shop</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #1d2939;
      background: #f4f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header {
      padding: 28px max(24px, calc((100% - 1120px) / 2));
      color: white;
      background: #183b56;
    }

    header p { margin: 6px 0 0; color: #d4e5f2; }
    h1 { margin: 0; font-size: 1.6rem; }
    main { width: min(1120px, calc(100% - 32px)); margin: 28px auto; }

    .notice {
      margin-bottom: 20px;
      padding: 12px 16px;
      border: 1px solid #b8d9ef;
      border-radius: 8px;
      color: #17466a;
      background: #eaf5fc;
      font-size: .92rem;
    }

    .panel {
      margin-bottom: 20px;
      padding: 22px;
      border: 1px solid #e1e7ef;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 8px #193b5610;
    }

    .panel-heading, .toolbar, .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h2 { margin: 0 0 18px; font-size: 1.15rem; }
    .panel-heading h2 { margin: 0; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      color: inherit;
      background: white;
      font: inherit;
    }

    input:focus, textarea:focus {
      outline: 3px solid #b8d9ef;
      border-color: #3478a8;
    }

    textarea { min-height: 82px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; }
    .checkbox-label input { width: auto; }
    .form-actions { display: flex; gap: 9px; }

    button {
      padding: 9px 13px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: white;
      background: #216b9b;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #18577f; }
    button.secondary { color: #344054; border-color: #d0d5dd; background: white; }
    button.secondary:hover { background: #f2f4f7; }
    button.danger { color: #b42318; border-color: #fecdca; background: white; }
    button.danger:hover { background: #fff1f0; }
    button.small { padding: 6px 9px; font-size: .84rem; }

    .toolbar { margin: 18px 0 12px; }
    .toolbar input { max-width: 320px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #eaecf0; }
    th { color: #475467; font-size: .82rem; }
    td { font-size: .9rem; }
    .description { max-width: 240px; color: #667085; }
    .badge { padding: 4px 8px; border-radius: 999px; font-size: .78rem; }
    .badge.active { color: #067647; background: #ecfdf3; }
    .badge.inactive { color: #475467; background: #f2f4f7; }
    .empty { padding: 28px; color: #667085; text-align: center; }

    @media (max-width: 640px) {
      header { padding: 22px 16px; }
      main { margin-top: 18px; }
      .panel { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar input { max-width: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Online Shop</h1>
    <p>Product management</p>
  </header>

  <main>
    <div class="notice">
      This is a front-end mockup. Changes are held in this page only and are not saved to PostgreSQL.
    </div>

    <section class="panel" aria-labelledby="form-title">
      <div class="panel-heading">
        <h2 id="form-title">Add a product</h2>
      </div>
      <form id="product-form">
        <div class="form-grid">
          <label>
            SKU
            <input id="sku" name="sku" maxlength="64" required>
          </label>
          <label>
            Product name
            <input id="name" name="name" maxlength="200" required>
          </label>
          <label class="wide">
            Description
            <textarea id="description" name="description"></textarea>
          </label>
          <label>
            Price
            <input id="price" name="price" type="number" min="0" step="0.01" required>
          </label>
          <label>
            Stock quantity
            <input id="stock" name="stock" type="number" min="0" step="1" value="0" required>
          </label>
          <label class="checkbox-label">
            <input id="active" name="active" type="checkbox" checked>
            Active product
          </label>
          <div class="form-actions wide">
            <button id="save-button" type="submit">Add product</button>
            <button id="cancel-button" class="secondary" type="button" hidden>Cancel</button>
          </div>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="products-title">
      <div class="toolbar">
        <h2 id="products-title">Products</h2>
        <label>
          <span class="visually-hidden">Search products</span>
          <input id="search" type="search" placeholder="Search by SKU or name">
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">SKU</th>
              <th scope="col">Name</th>
              <th scope="col">Description</th>
              <th scope="col">Price</th>
              <th scope="col">Stock</th>
              <th scope="col">Status</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    const products = [
      { id: 1, sku: "SKU-001", name: "Everyday Backpack", description: "Lightweight backpack for daily use.", price: 49.99, stock: 18, active: true },
      { id: 2, sku: "SKU-002", name: "Insulated Bottle", description: "Reusable stainless steel bottle.", price: 24.50, stock: 42, active: true },
      { id: 3, sku: "SKU-003", name: "Canvas Tote", description: "A simple reusable shopping bag.", price: 12.00, stock: 0, active: false }
    ];

    const form = document.querySelector("#product-form");
    const rows = document.querySelector("#product-rows");
    const search = document.querySelector("#search");
    const saveButton = document.querySelector("#save-button");
    const cancelButton = document.querySelector("#cancel-button");
    const formTitle = document.querySelector("#form-title");
    let editingId = null;

    function makeCell(value, className) {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) cell.className = className;
      return cell;
    }

    function renderProducts() {
      const query = search.value.trim().toLowerCase();
      const visibleProducts = products.filter((product) =>
        product.sku.toLowerCase().includes(query) ||
        product.name.toLowerCase().includes(query)
      );
      rows.replaceChildren();

      if (visibleProducts.length === 0) {
        const row = document.createElement("tr");
        const cell = makeCell("No products found.");
        cell.colSpan = 7;
        cell.className = "empty";
        row.append(cell);
        rows.append(row);
        return;
      }

      for (const product of visibleProducts) {
        const row = document.createElement("tr");
        row.append(
          makeCell(product.sku),
          makeCell(product.name),
          makeCell(product.description || "—", "description"),
          makeCell(`$${product.price.toFixed(2)}`),
          makeCell(String(product.stock))
        );

        const statusCell = document.createElement("td");
        const badge = document.createElement("span");
        badge.className = `badge ${product.active ? "active" : "inactive"}`;
        badge.textContent = product.active ? "Active" : "Inactive";
        statusCell.append(badge);
        row.append(statusCell);

        const actions = document.createElement("td");
        actions.className = "actions";
        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "secondary small";
        editButton.dataset.action = "edit";
        editButton.dataset.id = String(product.id);
        editButton.textContent = "Edit";
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "danger small";
        deleteButton.dataset.action = "delete";
        deleteButton.dataset.id = String(product.id);
        deleteButton.textContent = "Delete";
        actions.append(editButton, deleteButton);
        row.append(actions);
        rows.append(row);
      }
    }

    function resetForm() {
      form.reset();
      document.querySelector("#stock").value = "0";
      document.querySelector("#active").checked = true;
      editingId = null;
      saveButton.textContent = "Add product";
      cancelButton.hidden = true;
      formTitle.textContent = "Add a product";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const sku = formData.get("sku").trim();
      const duplicateSku = products.some((product) =>
        product.sku.toLowerCase() === sku.toLowerCase() && product.id !== editingId
      );

      if (duplicateSku) {
        document.querySelector("#sku").setCustomValidity("This SKU is already in use.");
        document.querySelector("#sku").reportValidity();
        return;
      }

      document.querySelector("#sku").setCustomValidity("");
      const product = {
        id: editingId ?? Math.max(0, ...products.map((item) => item.id)) + 1,
        sku,
        name: formData.get("name").trim(),
        description: formData.get("description").trim(),
        price: Number(formData.get("price")),
        stock: Number(formData.get("stock")),
        active: formData.has("active")
      };
      const existingIndex = products.findIndex((item) => item.id === editingId);
      if (existingIndex === -1) products.push(product);
      else products[existingIndex] = product;

      resetForm();
      renderProducts();
    });

    document.querySelector("#sku").addEventListener("input", (event) => {
      event.currentTarget.setCustomValidity("");
    });

    rows.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = Number(button.dataset.id);
      const product = products.find((item) => item.id === id);
      if (!product) return;

      if (button.dataset.action === "edit") {
        editingId = id;
        document.querySelector("#sku").value = product.sku;
        document.querySelector("#name").value = product.name;
        document.querySelector("#description").value = product.description;
        document.querySelector("#price").value = product.price.toFixed(2);
        document.querySelector("#stock").value = product.stock;
        document.querySelector("#active").checked = product.active;
        saveButton.textContent = "Save changes";
        cancelButton.hidden = false;
        formTitle.textContent = "Edit product";
        document.querySelector("#sku").focus();
      } else if (button.dataset.action === "delete") {
        products.splice(products.findIndex((item) => item.id === id), 1);
        if (editingId === id) resetForm();
        renderProducts();
      }
    });

    cancelButton.addEventListener("click", resetForm);
    search.addEventListener("input", renderProducts);
    renderProducts();
  </script>
</body>
</html>
